{% set name = "qdrant" %}
{% set version = "1.18.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/qdrant/qdrant/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0ad3251375dbbdeeca706509ad723545efff813537a52c05463393d9bc5068c2

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - pkg-config  # [unix]
    - make  # [unix]
  host:
    # Need libclang.dll, in more recent versions libclang only provides .lib on windows
    - libclang 12.0.0  # [win]
    # libclang is not enough on linux, it needs activation scripts from clangdev
    # Pinning to latest
    - clangdev 20.1.8  # [linux]
    - libprotobuf {{ libprotobuf }}
    - python
    - pip
  run:
    - ca-certificates  # [unix]
    - tzdata  # [unix]
    - python
    - grpc-interceptor >=0.15,<0.16
    - grpc-requests >=0.1,<0.2
    - more-itertools >=10.8,<11
    - pyjwt >=2.10,<3
    - jsons >=1.6.3,<2
    - pytest >=8.4,<9
    - pytest-timeout >=2.4,<3
    - pytest-cases >=3.9.1,<4
    - requests >=2.32.5,<3
    - schemathesis >=3.39.16,<4
    - retry >=0.9.2,<0.10
    - docker-py >=7.1.0,<8
    - pytest-xdist >=3.8.0,<4
    - pytest-subtests >=0.14.1,<0.15
    - qdrant-client >=1.16.1,<2
    - tqdm >=4.67.1,<5

test:
  commands:
    - qdrant --help
    - test -f $PREFIX/bin/qdrant  # [unix]
    - if not exist "%PREFIX%\\Library\\bin\\qdrant.exe" exit 1  # [win]

about:
  home: https://qdrant.tech
  summary: Vector similarity search engine and vector database.
  description: |
    Qdrant (read: quadrant) is a vector similarity search engine and vector database.
    It provides a production-ready service with a convenient API to store, search,
    and manage points—vectors with an additional payload Qdrant is tailored to
    extended filtering support. It makes it useful for all sorts of neural-network
    or semantic-based matching, faceted search, and other applications.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/qdrant/qdrant
  doc_url: https://qdrant.tech/documentation

extra:
  recipe-maintainers:
    - Cansisti
