{% set name = "qdrant" %}
{% set version = "1.18.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 0ad3251375dbbdeeca706509ad723545efff813537a52c05463393d9bc5068c2

build:
  number: 1

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cmake
    - libtool  # [linux]
    - pkg-config  # [unix]
    - make  # [unix]
    - libprotobuf 7.35.1  # [linux]
  host:
    - libprotobuf 7.35.1
  run:
    # https://github.com/qdrant/qdrant/blob/v1.18.1/Dockerfile#L184
    - ca-certificates  # [unix]
    - tzdata  # [unix]
    # libunwind8 -> 8 is ABI version. Latest 1.8.3 in main points on lib/libunwind.so.8
    - libunwind  # [linux]

test:
  commands:
    - qdrant --help
    - test -f $PREFIX/bin/qdrant  # [unix]
    - if not exist "%PREFIX%\\Library\\bin\\qdrant.exe" exit 1  # [win]

about:
  home: https://qdrant.tech
  summary: Vector similarity search engine and vector database.
  description: |
    Qdrant (read: quadrant) is a vector similarity search engine and vector database.
    It provides a production-ready service with a convenient API to store, search,
    and manage points—vectors with an additional payload Qdrant is tailored to
    extended filtering support. It makes it useful for all sorts of neural-network
    or semantic-based matching, faceted search, and other applications.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/qdrant/qdrant
  doc_url: https://qdrant.tech/documentation

extra:
  recipe-maintainers:
    - Cansisti
